services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bienestar_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - bienestar_network
    depends_on:
      - postgres

  webserver:
    image: nginx:alpine
    container_name: bienestar_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bienestar_network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: bienestar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_unt
      POSTGRES_USER: bienestar_user
      POSTGRES_PASSWORD: bienestar_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - bienestar_network

networks:
  bienestar_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
